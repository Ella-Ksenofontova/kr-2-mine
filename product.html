<!DOCTYPE html>

<body class="d-flex flex-column justify-content-between min-vh-100">
    <header class="navbar navbar-expand-lg bg-primary-subtle">
        <div class="container-fluid">
            <a class="navbar-brand" href="index.html">MyShop</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbar-links"
                aria-controls="navbar-links" aria-expanded="false" aria-label="Переключить навигацию">
                <span class="navbar-toggler-icon"></span>
            </button>
            <nav class="navbar-collapse collapse" aria-label="Основная навигация" id="navbar-links">
                <ul class="navbar-nav">
                    <li class="nav-item"><a href="./catalog.html" class="nav-link">Каталог</a></li>
                    <li class="nav-item"><a href="./order.html" class="nav-link">Оформить заказ</a>
                    </li>
                    <li class="nav-item"><a href="./contacts.html" class="nav-link">Обратная связь</a>
                    </li>
                </ul>
            </nav>
        </div>
    </header>
    <main class="p-3">
        <section class="container">
            <div class="row">
                <h1 class="display-3">Образец страницы с товаром</h1>
            </div>
            <div class="row align-items-start">
                <img src="./images/shoes.jpg" alt="Образец товара" class="col-md-6">
                <div class="col-md-6">
                    <div class="d-flex gap-2 align-items-center mb-3">
                        <div>2500 руб.</div>
                        <a href="order.html" class="btn btn-primary">Купить</a>
                    </div>
                    <table class="table table-bordered table-striped">
                        <caption class="caption-top">Характеристики товара</caption>
                        <thead></thead>
                        <tbody class="product-info__table-body">
                            <tr class="product-info__table-row">
                                <td class="product-info__table-cell">Материал</td>
                                <td class="product-info__table-cell">Искусственная кожа, резина</td>
                            </tr>
                            <tr class="product-info__table-row">
                                <td class="product-info__table-cell">Страна производства</td>
                                <td class="product-info__table-cell">Китай</td>
                            </tr>
                            <tr class="product-info__table-row">
                                <td class="product-info__table-cell">Категория</td>
                                <td class="product-info__table-cell">Обувь</td>
                            </tr>
                            <tr class="product-info__table-row">
                                <td class="product-info__table-cell">Пол</td>
                                <td class="product-info__table-cell">Унисекс</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </section>
    </main>

    </footer>
