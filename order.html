<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Оформление заказа</title>
    <link rel="stylesheet" href="./css/custom.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body class="d-flex flex-column justify-content-between min-vh-100">
    <header class="navbar navbar-expand-lg bg-primary-subtle">
        <div class="container-fluid">
            <a class="navbar-brand" href="index.html">MyShop</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbar-links"
                aria-controls="navbar-links" aria-expanded="false" aria-label="Переключить навигацию">
                <span class="navbar-toggler-icon"></span>
            </button>
            <nav class="navbar-collapse collapse" aria-label="Основная навигация" id="navbar-links">
                <ul class="navbar-nav">
                    <li class="nav-item"><a href="./catalog.html" class="nav-link">Каталог</a></li>
                    <li class="nav-item"><a href="./order.html" class="nav-link">Оформить заказ</a>
                    </li>
                    <li class="nav-item"><a href="./contacts.html" class="nav-link">Обратная связь</a>
                    </li>
                </ul>
            </nav>
        </div>
    </header>
    <main class="p-3">
        <div class="container">
            <div class="row align-items-stretch">
                <section class="col-12 col-md-7">
                    <h1 class="display-3">Оформить заказ</h1>
                    <h2 class="display-5">3 товара</h2>
                    <ul class="p-0 container d-flex flex-column gap-3">
                        <li class="d-flex align-items-center flex-wrap row">
                            <img src="./images/shoes.jpg" alt="" class="col-12 col-md-3">
                            <h3 class="fw-normal m-0 col-8 col-md-6"><a href="./product.html"
                                    class="text-decoration-none text-body">Кроссовки</a></h3>
                            <div class="col-4 col-md-3">
                                2500 руб.
                            </div>
                        </li>
                        <li class="d-flex align-items-center flex-wrap row">
                            <img src="./images/clock.jpg" alt="" class="col-12 col-md-3">
                            <h3 class="fw-normal m-0 col-8 col-md-6"><a href="./product.html"
                                    class="text-decoration-none text-body">Часы настенные</a></h3>
                            <div class="col-4 col-md-3">
                                <del class="old-price d-block">1200 руб.</del> 900 руб.
                            </div>
                        </li>
                        <li class="d-flex align-items-center flex-wrap row">
                            <img src="./images/perfume.jpg" alt="" class="col-12 col-md-3">
                            <h3 class="fw-normal m-0 col-8 col-md-6"><a href="./product.html"
                                    class="text-decoration-none text-body">Парфюм</a></h3>
                            <div class="col-4 col-md-3">
                                5000 руб.
                            </div>
                        </li>
                    </ul>
                    <div>Итого: 8400 руб.</div>
                </section>
                <aside class="col-12 col-md-5 bg-body-secondary  p-2">
                    <form id="order-form" onsubmit="alert('Заказ оформлен!')">
                        <div class="container">
                            <div class="row">
                                <div class="container bg-primary-subtle p-2 col-lg-8 card-front">
                                    <div class="row">
                                        <div class="col-12">
                                            <label for="card-number" class="form-label">Номер карты:</label>
                                            <input class="form-control" type="text" id="card-number" required
                                                autocomplete="cc-number">
                                        </div>
                                    </div>
                                    <div class="row align-items-end">
                                        <div class="col-6">
                                            <label for="card-name" class="form-label">Владелец:</label>
                                            <input type="text" id="card-name" class="form-control" required
                                                autocomplete="cc-name">
                                        </div>
                                        <div class="col-6">
                                            <label for="expires" class="form-label">Срок действия:</label>
                                            <input type="text" id="expires" class="form-control" required
                                                autocomplete="cc-exp">
                                        </div>
                                    </div>
                                </div>
                                <div class="container bg-primary-subtle p-2 col-lg-4 card-back">
                                    <div class="row">
                                        <div class="col-6 offset-6 col-sm-5 offset-sm-7 offset-lg-0 col-lg-12">
                                            <label for="cvv" class="form-label">CVV-код:</label>
                                            <input type="text" id="cvv" class="form-control" required
                                                autocomplete="cc-csc">
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <label for="name" class="form-label">Имя:</label>
                        <input type="text" id="name" class="form-control" required autocomplete="given-name">
                        <label for="surname" class="form-label">Фамилия:</label>
                        <input type="text" id="surname" class="form-control" required autocomplete="additional-name">
                        <label for="birthday" class="form-label">Дата рождения:</label>
                        <input type="date" id="birthday" class="form-control" required autocomplete="bday">
                        <button class="btn btn-primary mt-2">Готово</button>
                    </form>
                </aside>
            </div>
        </div>
    </main>
    <footer id="contacts" class="d-flex justify-content-between px-4 py-3 bg-primary-subtle">
        <p class="m-0">&copy; 2026 Элла Ксенофонтова. Все права защищены.</p>
        <p class="m-0"><a class="footer__link" href="tel:89858944403">+7 (985)-894-44-03</a></p>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
